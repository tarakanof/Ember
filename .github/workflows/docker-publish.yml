name: Publish Docker image

# Builds + pushes to Docker Hub when a GitHub Release on a strict-semver vX.Y.Z
# tag is published. Manual `workflow_dispatch` works too, but must target a
# vX.Y.Z tag ref — the semver gate below rejects branch dispatches (e.g. main).
# Required repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# Image: docker.io/<USERNAME>/ember
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: ember

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate strict semver tag (refuse pre-releases / odd tags)
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$ref' is not strict semver vX.Y.Z; refusing to publish."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # Render a job summary on the run page (Actions → run → Summary).
      # The Docker Hub namespace shows as *** because DOCKERHUB_USERNAME is a
      # secret; store it as a repo variable (vars.) instead if you want it shown.
      - name: Job summary
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          {
            echo "## 📦 Published \`${{ env.IMAGE_NAME }}\` \`${{ steps.meta.outputs.version }}\`"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Registry | Docker Hub |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| SBOM + provenance | attached |"
            echo ""
            echo "**Tags**"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Pull**"
            echo ""
            echo '```sh'
            echo "docker pull $IMAGE:${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
