name: release

on:
  push:
    # GitHub Actions ref filters use minimatch syntax: `[0-9]` is a valid
    # character class but `+` is NOT a quantifier (it's a literal `+`).
    # We use a loose glob here as a cheap pre-filter and enforce strict
    # semver via a bash regex inside the job (see "Validate strict semver"
    # step below). Without the bash gate, tags like `v0.1.0-rc1` and
    # `v0.1.0.0` would also match this pattern and publish.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  packages: write   # required for ghcr.io push via GITHUB_TOKEN

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      # Default fetch-depth=1 is sufficient: the Dockerfile's `go build
      # -buildvcs=true` only needs `git rev-parse HEAD` and
      # `git status --porcelain`, both of which work on shallow clones.
      - uses: actions/checkout@v4

      - name: Validate strict semver
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not strict semver vX.Y.Z; refusing to publish."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"   # v0.1.0 → 0.1.0
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tarakanof/awtrix-ai-status:${{ steps.tags.outputs.version }}
            ghcr.io/tarakanof/awtrix-ai-status:latest
          # Reuse the existing Dockerfile as-is. -buildvcs=true is already
          # baked into the Dockerfile's `go build` invocation, so the
          # image's `version` and /metrics build_info will report the
          # release tag's commit SHA.
          # Defaults left untouched: SLSA provenance attestations are pushed
          # as separate OCI referrer manifests and don't affect `docker pull`
          # of the image manifest itself. Re-evaluate if going public and
          # supply-chain signing matters.
