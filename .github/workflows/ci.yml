name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            macos:
              - 'macos/**'
              - 'scripts/**'
              - 'cmd/ember/testdata/**'
              - 'cmd/ember-claude-producer/testdata/**'
              - '.github/workflows/ci.yml'

  go:
    name: Go (fmt, vet, test -race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race

  producers-cross:
    name: Producers (cross-compile, install script)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build + vet producers for every release target
        run: |
          pkgs="./internal/producer/... ./internal/discovery/... ./cmd/ember-claude-producer/... ./cmd/ember-codex-producer/... ./cmd/ember-t3-producer/..."
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            echo "::group::$target"
            for p in claude codex t3; do
              go build -o /dev/null "./cmd/ember-$p-producer"
            done
            # shellcheck disable=SC2086 # word-split the package list
            go vet $pkgs
            echo "::endgroup::"
          done

      - name: install-producers.sh test
        run: scripts/install-producers_test.sh

  producers-arm64:
    name: Producers (linux/arm64 test -race)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race (producers)
        run: go test -race ./internal/producer/... ./internal/discovery/... ./cmd/ember-claude-producer/... ./cmd/ember-codex-producer/... ./cmd/ember-t3-producer/...

  macos:
    name: macOS (swift test, unsigned app build)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: swift test (EmberKit)
        run: swift test --package-path macos

      - name: xcodegen generate
        run: xcodegen generate --spec macos/project.yml --project macos

      - name: xcodebuild (unsigned Debug)
        run: |
          xcodebuild -project macos/Ember.xcodeproj -scheme Ember \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: String catalog is complete
        run: scripts/strings.sh check build/DerivedData
