name: Ember
options:
  bundleIdPrefix: com.ember
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  EmberKit:
    path: .
targets:
  Ember:
    type: application
    platform: macOS
    sources:
      - path: Ember
    dependencies:
      - package: EmberKit
        product: EmberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ember.Ember
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Ember/Info.plist
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
