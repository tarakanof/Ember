name: Ember
options:
  bundleIdPrefix: com.ember
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  EmberKit:
    path: .
targets:
  Ember:
    type: application
    platform: macOS
    sources:
      - path: Ember
        excludes:
          - "LaunchAgents/**"
    dependencies:
      - package: EmberKit
        product: EmberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ember.Ember
        MARKETING_VERSION: "0.24.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Ember/Info.plist
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: VX7Q4NH37M
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
    postCompileScripts:
      - script: |
          "${SRCROOT}/../scripts/build-producers.sh" "${CODESIGNING_FOLDER_PATH}"
        name: Bundle & sign producer helpers
        basedOnDependencyAnalysis: false
