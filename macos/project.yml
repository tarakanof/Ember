name: AwtrixMenu
options:
  bundleIdPrefix: com.awtrix-ai-status
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  AwtrixMenuKit:
    path: .
targets:
  AwtrixMenu:
    type: application
    platform: macOS
    sources:
      - path: AwtrixMenu
    dependencies:
      - package: AwtrixMenuKit
        product: AwtrixMenuKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awtrix-ai-status.AwtrixMenu
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AwtrixMenu/Info.plist
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
