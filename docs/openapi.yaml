  /v1/devices/{id}/config:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [devices]
      operationId: getKnobConfig
      summary: A device's settings
      description: |
        A knob's settings, or for the clock (`awtrix-ng`) its presentation
        config (stored in `clock_config_json` once migrated, before that a
        façade over the overlay slices), the hidden tools and the clock's
        own app order (ARCHITECTURE "Clock record and config façade").
        `X-Ember-Config-Version` carries the version.
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          $ref: "#/components/responses/Object"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Clock only. Another clock app order change held the
            lock until this request's 11 s deadline; nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [devices]
      operationId: putKnobConfig
      summary: Merge a device's settings
      description: |
        Objects merge field by field, arrays (and the clock's `icon_ids`)
        replace whole, an unknown key is a 400, `{}` changes nothing. For
        the clock the body is merged onto the current config under the
        config lock and stored (clock config, changed slices, hidden tools)
        in one SQLite transaction; a failed store is
        a 500 and changes nothing in memory or the store. A `rotation`
        needs both `order` and `disabled` (missing or `null` is a 400). It is
        sent to the clock first (its error status passes through, 502 when
        unreachable) unless `order` is exactly the clock's whole list, read
        just before, every app already holds a slot and no app's on/off
        state changes (ARCHITECTURE "Rotation"),
        and clock app order changes run one at a time; if the
        slices then fail, the error says the app order was already written.
        For a knob that reported `caps` (DEVICE-PROTOCOL "Capabilities"), a
        change that turns on a page outside `caps.pages` (one not already on)
        or whose compact JSON exceeds `caps.limits.config_bytes` is a 400, and
        so is a change of the knob's `display.rotation` (`0`, `90`, `180` or
        `270`) to a value not in `caps.rotations` (missing = `[0]`). A
        legacy knob (no `caps`) gets no such check. Any knob
        `display.rotation` outside `0|90|180|270` is a 400.
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          $ref: "#/components/responses/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: The settings store failed; no settings changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: Clock only. Another clock app order change held the
            lock until this request's 11 s deadline (nothing changed), the
            PUT ran out of time before committing settings, or the clock
            itself answered 503.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
