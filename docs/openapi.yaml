        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/pomodoro/resume:
    post:
      tags: [control]
      operationId: pomodoroResume
      summary: Resume a paused phase
      security: [{ownerToken: []}, {deviceToken: []}, {clientToken: [control]}]
      responses:
        "200":
          description: The timer after the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PomodoroStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/pomodoro/stop:
    post:
      tags: [control]
      operationId: pomodoroStop
      summary: Stop the timer
      security: [{ownerToken: []}, {deviceToken: []}, {clientToken: [control]}]
      responses:
        "200":
