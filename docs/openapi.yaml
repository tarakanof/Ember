          $ref: "#/components/responses/NotFound"
  /v1/pomodoro/heatmap:
    get:
      tags: [read]
      operationId: getPomodoroHeatmap
      summary: Focus heatmap
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Object"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/pomodoro/workhours:
    get:
      tags: [read]
      operationId: getPomodoroWorkHours
      summary: Focus by hour of day
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Object"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/pomodoro/dashboard:
    get:
      tags: [read]
      operationId: getPomodoroDashboard
      summary: HTML focus dashboard
      security: []
      responses:
        "200":
          description: An HTML page.
          content:
