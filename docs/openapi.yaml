      responses:
        "200":
          $ref: "#/components/responses/Object"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [settings]
      operationId: putUsageConfig
      description: |
        Merge semantics. Once the clock config is migrated, this config's
        clock presentation keys are stored in the clock config (an alias,
        ARCHITECTURE "Clock record and config façade"); the GET still
        returns the merged shape.
      summary: Merge usage card settings
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          $ref: "#/components/responses/Object"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/usage/accounts:
    get:
      tags: [settings]
      operationId: getUsageAccounts
      summary: Usage accounts in display order, with their names and settings
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: Every account seen in the last 7 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAccounts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [settings]
      operationId: putUsageAccounts
      summary: Set account names, hiding and order (merge by account id)
      description: |
        Master token only; every client token, `admin` included, gets 403.
        The body maps account ids to their settings; an id's object replaces
        that account's settings, `null` or `{}` resets them, and ids left out
        keep theirs. An id the server doesn't list is a 400. The reply is
        the GET shape.
      x-internal: true
      x-master-only: true
      security: [{ownerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                oneOf:
                  - $ref: "#/components/schemas/UsageAccountPrefs"
                  - type: "null"
            example:
              "claude:3f9a1c0b7d2e4a65": {name: Work, order: 0}
              claude: null
      responses:
        "200":
          description: The accounts after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAccounts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
