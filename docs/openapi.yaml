  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List knobs and client tokens
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: Every record, without token material.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [devices]
      operationId: mintDevice
      summary: Mint a knob or client token
      description: |
        `{"kind":"client","name":"CI","scopes":["ingest"]}` mints an `ekc_`
        client token; `{"kind":"cinder-knob","hw_id":"…"}` provisions a knob.
        The response carries the token once (`Cache-Control: no-store`).
        Minting (a client or a knob) takes the master token: a client token,
        admin included, gets 403. At most 64 clients (400 past that).
      security: [{ownerToken: []}, {clientToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintRequest"
            example:
              kind: client
              name: CI runner
              scopes: [ingest]
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedDevice"
        "200":
          description: A known knob hw_id re-provisioned; its old token is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    patch:
      tags: [devices]
      operationId: renameDevice
      summary: Rename a record
      security: [{ownerToken: []}, {clientToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 64
      responses:
        "200":
          description: The renamed record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Revoke a knob or client token
      description: Deleting a client takes the master token (403 for any client token).
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/devices/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      tags: [devices]
      operationId: rotateDevice
      summary: Rotate a token
      description: |
        A client's new token is minted at once and returned (200); the old
        one stops working. A knob's rotation is only marked (202) and its
        next checkin collects the new token. Rotating a client takes the
        master token (403 for any client token).
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: Client rotated; the new token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedDevice"
        "202":
          description: Knob rotation started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
