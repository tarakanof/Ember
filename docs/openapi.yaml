openapi: 3.1.0
info:
  title: Ember API
  version: "1"
  summary: Desk-display hub for AI agent activity, a Pomodoro timer and friends.
  description: |
    The HTTP contract of the Ember server (`cmd/ember`). Sources post agent
    status and usage, controllers drive the Pomodoro timer, displays read
    state; the macOS app configures everything.

    **Stability.** Operations without `x-internal` are the public v1
    contract: changes are additive only. Operations marked `x-internal: true`
    (the `/v1/device/*` clock proxy, the `…/config` settings and the
    now-playing plumbing) serve Ember.app and may change between releases.

    **Auth.** Reads are open on the LAN. Writes take a bearer token:
    - the master `EMBER_TOKEN` (`ownerToken`) passes every owner route;
    - a scoped client token (`clientToken`, prefix `ekc_`) passes the routes
      whose requirement lists one of its scopes; the `admin` scope passes
      every route that lists any client scope;
    - a knob device token (`deviceToken`, prefix `ekd_`) passes the
      device-self routes and the control routes.

    Operations marked `x-master-only: true` refuse every client token,
    `admin` included (403). On `/v1/devices/{id}` and its `rotate` that
    holds when `{id}` names a client (`client-…`).

    An `ingest` client token minted with `sources` (not allowed with
    `admin`) is bound to them: `POST`/`DELETE
    /v1/status` and `POST /v1/usage` naming any other `source` (or, for
    usage, none) are 403. Usage stays keyed by tool, so a bound token's usage
    post is also 403 when that tool's stored entry came from a source outside
    its list (no entry yet: accepted). Sessions are keyed
    `source/tool/session`, so a bound token's status `tool` and `session`
    may not contain `/` (400). A token without `sources` may name any source.

    A missing or unknown token is 401; a known client token without the
    scope, or bound to other sources, is 403. Errors are `{"error": "…"}`. Request bodies are capped at
    1 MB (413). The `…/config` PUTs merge: omitted keys keep their value, an
    invalid merged result is a 400 and changes nothing.

    This file keeps a fixed layout that `cmd/ember/openapi_test.go` reads:
    paths at two spaces, methods at four, and a one-line flow `security:` on
    every operation.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://ember.local:3627
    description: Default port; the server also advertises `_ember._tcp` over mDNS.
tags:
  - name: ingest
    description: Sources report activity (agent hooks, CI, Home Assistant). Scope `ingest`.
  - name: control
    description: Drive the Pomodoro timer. Scope `control`.
  - name: read
    description: Unauthenticated state and preview reads.
  - name: devices
    description: The device registry (knobs) and the client token store. Owner or `admin`.
  - name: device-self
    description: Called by a knob with its own device token.
  - name: firmware
    description: Knob firmware images and over-the-air updates. Owner or `admin`.
  - name: settings
    description: Ember.app settings (merge PUT). Internal.
  - name: clock
    description: Proxy to the TC001 clock's awtrix-ng API. Internal.
  - name: nowplaying
    description: Now-playing reports, art and playback commands.
  - name: controls
    description: Knob gestures relayed to actions on one Mac (cinder#144).
  - name: operator
    description: Health and version.

components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: The master `EMBER_TOKEN`. Holds every scope.
    clientToken:
      type: http
      scheme: bearer
      description: |
        A scoped client token (`ekc_…`), minted with `POST /v1/devices`
        `{"kind":"client"}`. Scopes: `ingest`, `control`, `read`, `admin`
        (`admin` satisfies every scope).
    deviceToken:
      type: http
      scheme: bearer
      description: A knob device token (`ekd_…`), minted with `POST /v1/devices` `{"kind":"cinder-knob"}`.

  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      description: A device or client id (`knob-61fc8c`, `client-1a2b3c4d`).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Retries with the same key within 10 minutes are answered without repeating the action.
      schema:
        type: string
        maxLength: 256
    DumpID:
      name: dump
      in: path
      required: true
      description: A core dump id, 8 lower-case hex digits.
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    FirmwareVersion:
      name: version
      in: path
      required: true
      description: A stored firmware version (semantic version, `0.9.14`).
      schema:
        type: string
    FirmwareBuild:
      name: build
      in: path
      required: true
      description: The first 8 hex digits of the image's `app_elf_sha256`.
      schema:
        type: string
        pattern: "^[0-9a-f]{8}$"
    StatsRange:
      name: range
      in: query
      required: false
      schema:
        type: string
        enum: [15m, 1h, 24h]
        default: 1h

  responses:
    BadRequest:
      description: Malformed or invalid body or query.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or unknown token (or `EMBER_TOKEN` unset on the server).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: A client token without the required scope, or bound to other sources.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: token lacks the required scope "admin"
    NotFound:
      description: Unknown resource, or the feature is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The clock did not answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Object:
      description: A JSON object; see the server source for the exact shape.
      content:
        application/json:
          schema:
            type: object
    NoContent:
      description: Done; no body.
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The server has no data dir, so knob firmware and core dump storage are off.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    State:
      type: string
      enum: [idle, running, waiting, done, error]
    StatusRequest:
      type: object
      description: |
        One session's status. Sessions are keyed by `source`/`tool`/`session`
        and go stale when not refreshed. Unknown fields are ignored, so newer
        producers keep working against older servers.
      required: [source, tool, session, state]
      properties:
        source:
          type: string
          description: The host or origin, shown as the session's label (`dt-mbp`, `ci`).
        tool:
          type: string
          description: |
            Lower-cased tool id. `claude`, `codex` and `t3` have their own
            label and icon; any other value shows capitalised (`gemini` →
            "Gemini") with the default icon.
        session:
          type: string
          description: Stable id of the session within source and tool.
        state:
          $ref: "#/components/schemas/State"
        message:
          type: string
          description: Short text shown with done, waiting and error states.
        activity:
          type: string
          maxLength: 80
          description: "What the agent is doing now (`Bash: go test`)."
        tokens_today:
          type: integer
          format: int64
        context_pct:
          type: integer
          minimum: 0
          maximum: 100
        rate_window_pct:
          type: integer
          minimum: 0
          maximum: 100
        rate_reset_at:
          type: integer
          format: int64
          minimum: 0
          description: Unix seconds.
        source_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        context_number:
          type: boolean
        rate_bottom_bar:
          type: boolean
        rate_reset:
          type: boolean
        rate_reset_label:
          type: string
        source_card:
          type: boolean
        session_bar:
          type: boolean
        project:
          type: string
          description: |
            The session's project: the working directory's basename (Claude,
            Codex) or the thread title (T3). Whitespace is collapsed and the
            server keeps the first 32 characters. Absent from older producers
            and with `EMBER_SEND_PROJECT=0`.
    Session:
      allOf:
        - $ref: "#/components/schemas/StatusRequest"
        - type: object
          properties:
            updated_at:
              type: string
              format: date-time
            state_since:
              type: string
              format: date-time
              description: |
                When the session entered its current state. A repost in the
                same state keeps it, so it orders the waiting sessions
                (newest first) without the heartbeats reshuffling them.
    Render:
      type: object
      properties:
        text:
          type: string
        color:
          type: string
        waiting:
          type: integer
        running:
          type: integer
        errors:
          type: integer
        done:
          type: integer
        active_total:
          type: integer
        message:
          type: string
        source:
          type: string
          description: The winning session's source; empty when none.
        tool:
          type: string
    Snapshot:
      type: object
      properties:
        now:
          type: string
          format: date-time
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        render:
          $ref: "#/components/schemas/Render"
    UsageWindow:
      type: object
      required: [used_percent]
      properties:
        used_percent:
          type: number
          minimum: 0
          maximum: 100
        resets_at:
          type: integer
          format: int64
          description: Unix seconds.
        reset_label:
          type: string
          maxLength: 32
        window_minutes:
          type: integer
          format: int64
          description: >-
            The window's length when the producer knows it (Codex); the
            knob's 5h `starts_at` uses it, else 5 h. Outside 1 to 44640 it
            is ignored.
    UsageRequest:
      type: object
      additionalProperties: false
      required: [tool]
      properties:
        tool:
          type: string
          pattern: "^[a-z0-9_-]{1,32}$"
        source:
          type: string
        account_key:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: >-
            The account the windows belong to: the first 8 bytes, in hex, of
            sha256 over the tool and the account's ids, computed on the Mac
            (ARCHITECTURE "Usage per account"). Never a raw id or an email.
            Omitted by producers that can't read an account: one keyless
            account per tool.
        plan:
          type: string
          pattern: "^[a-z0-9_]{1,24}$"
          description: The account's plan (`max`, `pro`, `team`, `plus`, …); the default account name.
        five_hour:
          $ref: "#/components/schemas/UsageWindow"
        seven_day:
          $ref: "#/components/schemas/UsageWindow"
        models:
          type: object
          maxProperties: 4
          propertyNames:
            pattern: "^[a-z0-9_-]{1,24}$"
          additionalProperties:
            $ref: "#/components/schemas/UsageWindow"
    UsageAccountPrefs:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 24
          description: Trimmed; empty means the default name.
        hidden:
          type: boolean
          description: Left out of the knob's `usage` block.
        order:
          type: integer
          minimum: 0
          maximum: 999
          description: Sort key; accounts with one come first, ascending.
    UsageAccount:
      type: object
      required: [id, tool, plan, name, default_name, hidden, order, first_seen, updated_at, stale]
      properties:
        id:
          type: string
          description: '`<tool>:<account_key>`, or the bare tool name for a keyless account.'
        tool:
          type: string
        plan:
          type: [string, "null"]
        name:
          type: string
          description: The set name, else `default_name`.
        default_name:
          type: string
          description: The plan ("Max"), else the tool ("Claude"); numbered ("Max 1", "Max 2") when a tool has two on one plan.
        hidden:
          type: boolean
        order:
          type: [integer, "null"]
          description: The stored sort key, `null` when unset. The array is already in display order.
        first_seen:
          type: string
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
          description: The newest snapshot (after a restart, the last stored one); `null` with none.
        stale:
          type: boolean
    UsageAccounts:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/UsageAccount"
    NotifyRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        color:
          type: string
          default: "#FFFFFF"
        duration:
          type: integer
          default: 5
          description: Seconds.
        hold:
          type: boolean
          description: Keep the notification until dismissed on the clock.
        text_case:
          type: string
          enum: [inherit, upper, asTyped]
    ReminderFireRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: Trimmed to 200 characters.
        sound:
          type: boolean
        duration:
          type: integer
          minimum: 1
          maximum: 300
          default: 8
        native_icon_id:
          type: string
        hold:
          type: boolean
        repeat_sound:
          type: boolean
    PomodoroStatus:
      type: object
      properties:
        phase:
          type: string
          enum: [idle, focus, short_break, long_break]
        running:
          type: boolean
        paused:
          type: boolean
        remaining_sec:
          type: integer
        planned_sec:
          type: integer
        round:
          type: integer
          description: Completed focus phases in the current cycle.
    DeviceView:
      type: object
      description: "A device record (a knob or the clock), or a client token (`kind: client`), without token material."
      properties:
        id:
          type: string
          description: "`knob-…`, `clock-…` (last 6 characters of the clock's NG uid; at most one clock record, rewritten in place when the uid at the clock URL changes) or `client-…`."
        kind:
          type: string
          enum: [cinder-knob, awtrix-ng, client]
        hw_id:
          type: string
          description: 12 hex digits for a knob; the NG uid (lower case) for the clock; empty for a client.
        name:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
        config_version:
          type: integer
          description: 0 for a client. For the clock, a counter bumped on every change to its composed config (compare for inequality).
        rotation_pending:
          type: boolean
        rotated_at:
          type: [string, "null"]
          format: date-time
        last_checkin:
          type: [object, "null"]
          description: The knob's last checkin as reported (see the checkin request), plus `seen_at` and `applied_version`.
          properties:
            diag:
              type: object
              description: The checkin's `diag` object plus fields the server adds from the previous checkin.
              properties:
                reboots:
                  type: integer
                  minimum: 0
                  description: Increases of `boots` seen by the server (a drop in `boots` counts one).
                prev_reset_reason:
                  type: string
                  description: The reset reason before the latest reboot; left out when `boots` rose by more than one between checkins.
                reboots_since_seen:
                  type: integer
                  minimum: 2
                  description: How far `boots` jumped between two checkins when it rose by more than one.
        last_seen:
          type: object
          description: "Clock only: the last good device-watch probe. Absent until one succeeds."
          properties:
            seen_at:
              type: string
              format: date-time
            fw:
              type: string
            ip:
              type: string
            rssi:
              type: integer
            uptime_s:
              type: integer
        effective_caps:
          description: "Knobs only: the capabilities the server acts on (DEVICE-PROTOCOL \"Capabilities\")."
          allOf:
            - $ref: "#/components/schemas/DeviceCaps"
            - type: object
              required: [source, rotations]
              properties:
                source:
                  type: string
                  enum: [reported, legacy]
                  description: "`reported`: the last checkin's `caps`; `legacy`: the server's table for its `fw`."
                caps_error:
                  type: string
                  maxLength: 160
                  description: Why the last checkin's `caps` were dropped; absent when they were accepted or not sent.
        scopes:
          type: array
          description: Clients only.
          items:
            type: string
            enum: [ingest, control, read, admin]
        sources:
          type: array
          description: Clients bound to sources only; absent means any source.
          items:
            type: string
    MintedDevice:
      allOf:
        - $ref: "#/components/schemas/DeviceView"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The plaintext token. Shown once; the server keeps only its hash.
    MintRequest:
      oneOf:
        - type: object
          title: Knob
          additionalProperties: false
          required: [kind, hw_id]
          properties:
            kind:
              const: cinder-knob
            hw_id:
              type: string
              description: The knob's MAC; `:`/`-` are stripped. A known hw_id re-provisions (200).
            name:
              type: string
              maxLength: 64
        - type: object
          title: Client
          additionalProperties: false
          required: [kind, name, scopes]
          properties:
            kind:
              const: client
            name:
              type: string
              maxLength: 64
            scopes:
              type: array
              minItems: 1
              items:
                type: string
                enum: [ingest, control, read, admin]
            sources:
              type: array
              description: |
                Optional. Binds the token to these `source` values (no `/`) on
                `POST`/`DELETE /v1/status` and `POST /v1/usage` (403 for any
                other). Trimmed, sorted and deduplicated; needs the `ingest`
                scope and is a 400 with `admin` (an admin token could still
                `POST /v1/clear`). Omit for a token that may name any source.
              minItems: 1
              maxItems: 16
              items:
                type: string
                minLength: 1
                maxLength: 64
    DeviceCaps:
      type: object
      required: [view, pages, features]
      properties:
        view:
          type: array
          description: "`[min, max]` view majors the firmware parses, 1 ≤ min ≤ max."
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
            maximum: 1000
        pages:
          type: array
          description: Page ids compiled into the firmware.
          minItems: 1
          maxItems: 32
          items:
            type: string
            pattern: "^[a-z][a-z0-9_-]{0,15}$"
        features:
          type: array
          description: Feature tokens (registry in DEVICE-PROTOCOL.md).
          maxItems: 64
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,31}$"
        limits:
          type: object
          description: >-
            Largest body the firmware holds, in bytes; a missing or 0 key is unknown.
            Floors: `view_bytes` ≥ 4096, `config_bytes` ≥ the default config's compact
            size (447 today); caps below them are dropped.
          properties:
            view_bytes:
              type: integer
              minimum: 0
              maximum: 16777216
            config_bytes:
              type: integer
              minimum: 0
              maximum: 16777216
        rotations:
          type: array
          description: >-
            Display rotations in degrees the firmware can apply, `0` always listed.
            Missing means `[0]` (the server reads an empty list the same). Always
            present in `effective_caps`.
          minItems: 1
          maxItems: 4
          uniqueItems: true
          contains:
            const: 0
          items:
            type: integer
            enum: [0, 90, 180, 270]
    CheckinResult:
      type: object
      properties:
        config_version:
          type: integer
        config:
          type: object
          description: Present when the device's applied version is stale.
        new_token:
          type: string
          description: Present while a rotation is pending.
        diag_live_until:
          type: integer
          format: int64
        coredump_wanted:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: >-
            The reported `diag.crash.id` is not stored for this device; upload it with
            `PUT /v1/devices/self/coredump`. Only when the checkin carries `diag.crash.id`.
        coredump_ack:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: >-
            The reported `diag.crash.id` is stored; the knob may erase its dump.
            Only when the checkin carries `diag.crash.id`.
        ota:
          $ref: "#/components/schemas/OTAOffer"
        caps_ack:
          type: boolean
          enum: [true]
          description: The checkin's `caps` were accepted and stored. Absent when it sent none or invalid ones.
    FirmwareImage:
      type: object
      required: [build, channel, elf, idf_ver, project, sha256, size, uploaded_at, version]
      properties:
        build:
          type: string
          pattern: "^[0-9a-f]{8}$"
          description: First 8 hex digits of the image's `app_elf_sha256`; the knob reports it as `fw_build`.
        channel:
          type: string
          enum: [release, test]
          description: Automatic updates install `release` images only.
        elf:
          type: boolean
          description: The matching ELF is stored (core dump decoding).
        idf_ver:
          type: string
        project:
          type: string
          const: cinder
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the whole `.bin`, pinned at upload and sent in the offer.
        size:
          type: integer
          minimum: 65536
          maximum: 4194304
        uploaded_at:
          type: string
          format: date-time
        version:
          type: string
      example:
        build: a1b2c3d4
        channel: release
        elf: true
        idf_ver: v5.5.5
        project: cinder
        sha256: 9f2c4be1d0c3a7f6e5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e
        size: 1625408
        uploaded_at: "2026-10-06T12:00:00Z"
        version: 0.9.14
    OTAOffer:
      type: object
      description: >-
        Sent in the checkin answer only when the knob may update now: the knob reported
        `ota.rollback` true, `ota.image` valid and `ota.phase` idle, its `fw_build` differs
        from the offered build, no Pomodoro runs or is paused, no core dump is wanted, and
        (automatic offers) the version is a newer `release` image not in `blocked`.
      required: [attempt, auto, build, retry, sha256, size, url, version]
      properties:
        attempt:
          type: integer
          minimum: 1
          description: >-
            Per-device attempt id, monotonic. It stays the same while the same offer
            repeats and moves on for every new offer (a new version or a Retry), always
            past the `ota.last.attempt` the knob last reported (so a re-pair or a restored
            registry never reuses an id the knob still holds). The
            knob stores it with the attempt and echoes it in `ota.last.attempt`; Ember
            applies a `last` result only when its `attempt` is the current one.
        auto:
          type: boolean
          description: An automatic update; the knob waits for 10 min without input first.
        build:
          type: string
          pattern: "^[0-9a-f]{8}$"
        retry:
          type: boolean
          description: True once after an owner Retry; clears the knob's bad-image guard.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        size:
          type: integer
        url:
          type: string
          description: Always relative, `/v1/devices/self/firmware/<version>`.
        version:
          type: string
    OTAStatus:
      type: object
      description: A knob's update state, owner view. Times are whole-second RFC 3339; unknown values are null.
      required: [mode, target, phase, progress_pct, bytes, size, from, error, started_at, finished_at, blocked, running, available, waiting_for]
      properties:
        mode:
          type: string
          enum: [manual, auto]
          description: "`manual` (Ask first, the default) or `auto`."
        target:
          type: [string, "null"]
          description: The version the owner asked for; cleared once it runs.
        version:
          type: [string, "null"]
          description: The version of the current or last attempt (manual or automatic).
        phase:
          type: string
          enum: [idle, offered, downloading, installing, restarting, verifying, done, failed, rolled_back]
        progress_pct:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        bytes:
          type: [integer, "null"]
          description: Bytes of the image the server has sent (memory only).
        size:
          type: [integer, "null"]
        from:
          type: [string, "null"]
          description: The `fw` the knob ran when the offer started.
        error:
          type: [string, "null"]
          description: >-
            The knob's `ota.last.error` after `failed` or `rolled_back` (`refused`: the knob
            declined the offer for a lasting reason), or `not_started` when an offer was sent
            for 30 minutes (manual) or 24 hours (automatic) without the knob starting it.
            Other knob codes include `reset_waiting` (restarted while a verified image waited
            to install) and `health_display`, `health_render`, `health_heap`, `health_stack`
            (rolled back after failing that health check).
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        blocked:
          type: array
          description: Versions that failed or rolled back; automatic mode and `available` skip them until a Retry or a manual install. Deleted, evicted or replaced versions are pruned.
          items:
            type: string
        running:
          type: [object, "null"]
          properties:
            fw:
              type: string
            build:
              type: [string, "null"]
            slot:
              type: [integer, "null"]
            image:
              type: [string, "null"]
            rollback:
              type: boolean
        available:
          type: [string, "null"]
          description: The newest stored version above the running one (any channel) that is not in `blocked`.
        waiting_for:
          type: [string, "null"]
          enum: [pomodoro, coredump, idle_input, null]
      example:
        mode: manual
        target: 0.9.14
        version: 0.9.14
        phase: downloading
        progress_pct: 42
        bytes: 682000
        size: 1625408
        from: 0.9.13
        error: null
        started_at: "2026-10-06T12:01:00Z"
        finished_at: null
        blocked: [0.9.15]
        running: {fw: 0.9.13, build: 77aa01ff, slot: 0, image: valid, rollback: true}
        available: 0.9.14
        waiting_for: null
    DemoStatus:
      type: object
      required: [state, scene, id, queue_left]
      properties:
        state:
          type: string
          enum: [idle, pending, playing, unanswered, restarted]
        scene:
          type: string
        id:
          type: string
          description: The id the view's `demo` block carries and the knob reports.
        queue_left:
          type: integer
          description: Scenes queued after this one.
    CoredumpMeta:
      type: object
      required: [id, size, fw, received_at, reason, task, pc, elf]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}$"
        size:
          type: integer
        fw:
          type: string
          description: The firmware the knob reported at upload time.
        received_at:
          type: string
          format: date-time
        reason:
          type: string
          description: From the matching `diag.crash`; empty when unknown.
        task:
          type: string
        pc:
          type: string
        elf:
          type: string
          description: The crash's `elf` build (8 hex) when the last checkin reported it, else empty. `GET /v1/firmware/by-build/{elf}/elf` serves the ELF that decodes it.

paths:
  /healthz:
    get:
      tags: [operator]
      operationId: getHealthz
      summary: Liveness
      security: []
      responses:
        "200":
          description: Always ok while the process serves.
          content:
            application/json:
              schema:
                type: object
              example:
                status: ok
  /version:
    get:
      tags: [operator]
      operationId: getVersion
      summary: Build version
      security: []
      responses:
        "200":
          description: The build and the server's capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  binary:
                    type: string
                  version:
                    type: string
                  revision:
                    type: string
                  dirty:
                    type: boolean
                  go_version:
                    type: string
                  features:
                    type: array
                    description: Capabilities clients gate on. `firmware_delete_keep` means `DELETE /v1/firmware/{version}` takes `?keep=protected`.
                    items:
                      type: string
  /state:
    get:
      tags: [read]
      operationId: getState
      summary: Sessions and the aggregated render
      description: |
        Every live session and the legacy aggregated render. The
        `X-Ember-Devices-Epoch` header changes when the device registry does.
      security: []
      responses:
        "200":
          description: The snapshot.
          headers:
            X-Ember-Devices-Epoch:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"

  /v1/status:
    post:
      tags: [ingest]
      operationId: postStatus
      summary: Report a session's status
      description: |
        A client token bound to `sources` gets 403 for any other `source`,
        and 400 for a `/` in `tool` or `session`.
      security: [{ownerToken: []}, {clientToken: [ingest]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
            example:
              source: ci
              tool: gha
              session: deploy-42
              state: running
              activity: deploy api
      responses:
        "200":
          description: Stored; returns the aggregated render.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  render:
                    $ref: "#/components/schemas/Render"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [ingest]
      operationId: deleteStatus
      summary: Drop a session
      description: |
        A client token bound to `sources` gets 403 for any other `source`,
        and 400 for a `/` in `tool` or `session`.
      security: [{ownerToken: []}, {clientToken: [ingest]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, tool, session]
              properties:
                source:
                  type: string
                tool:
                  type: string
                session:
                  type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/clear:
    post:
      tags: [ingest]
      operationId: postClear
      summary: Drop every session
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          $ref: "#/components/responses/Object"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/notify:
    post:
      tags: [ingest]
      operationId: postNotify
      summary: Show a one-off notification on the clock
      security: [{ownerToken: []}, {clientToken: [ingest]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyRequest"
            example:
              text: washer done
              color: "#00FF88"
      responses:
        "200":
          description: Sent to the clock.
          content:
            application/json:
              schema:
                type: object
              example:
                ok: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/usage:
    get:
      tags: [read]
      operationId: getUsage
      summary: Latest usage snapshot per tool
      security: []
      responses:
        "200":
          description: Per-tool usage.
          content:
            application/json:
              schema:
                type: object
              examples:
                golden:
                  externalValue: ../cmd/ember/testdata/dashboard/usage.json
    post:
      tags: [ingest]
      operationId: postUsage
      summary: Report a tool's account usage windows
      description: |
        Usage is one entry per tool and `account_key` (no key: one keyless
        account per tool); the newest post wins, so several Macs on one
        account share an entry. The server stamps every post with its
        receive time, whatever the body says. An entry is dropped 7 days
        after its last post. `source` is trimmed; it labels the path
        (`endpoint`, `statusline`, `codex_stream`) and plays no part in the
        caps. Each writer (a client token, or the master token) keeps at
        most 8 accounts per tool and 16 in all, a new one replacing that
        writer's own oldest, never another writer's; for a client token,
        past 64 accounts in all a new account is a 507 and nothing is
        evicted (the master token is never refused). A client token
        bound to `sources` gets 403 for any other `source`, for none, and
        when any of the tool's stored entries came from a source outside
        its list, whatever the `account_key`; a tool with no entry yet is
        accepted (the next unbound post overwrites it). Ownership goes by
        the writer, not the `source`: a client token posting an account
        another writer created (the master token or another client token),
        live or known only from the registry, is 403, and so, when the token
        is bound, is any post to a tool another writer has an entry in. The
        master token may post to any account and then owns it, so no client
        token's cap can evict it.
      security: [{ownerToken: []}, {clientToken: [ingest]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageRequest"
            example:
              tool: gemini
              source: dt-mbp
              five_hour:
                used_percent: 42
                resets_at: 1791900000
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/reminders/fire:
    post:
      tags: [ingest]
      operationId: postReminderFire
      summary: Fire a reminder popup on the clock
      security: [{ownerToken: []}, {clientToken: [ingest]}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderFireRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "200":
          description: A duplicate of an Idempotency-Key seen in the last 10 minutes; nothing shown.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/reminders/preview:
    get:
      tags: [read]
      operationId: getReminderPreview
      summary: Preview frames of a reminder popup
      security: []
      parameters:
        - name: text
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Object"

  /v1/pomodoro/start:
    post:
      tags: [control]
      operationId: pomodoroStart
      summary: Start a phase
      security: [{ownerToken: []}, {deviceToken: []}, {clientToken: [control]}]
