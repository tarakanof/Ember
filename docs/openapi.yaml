        "200":
          $ref: "#/components/responses/Object"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "507":
          description: Client tokens only. 64 accounts are stored; a new account is refused rather than evicting another writer's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/usage/config:
    get:
      tags: [settings]
