  /v1/controls/action:
    post:
      tags: [controls, device-self]
      operationId: postControlsAction
      summary: Relay a knob gesture to the configured Mac
      description: |
        The device names a gesture, never an action: the server queues
        `{gesture, steps}` for the target Mac, whose Ember.app maps it to
        an action kept only in that Mac's settings. 202 `queued`, 200
        `duplicate` (same `Idempotency-Key` within 2 min), 401 for client
        tokens and unknown or deleted device tokens, 429 per caller
        (burst 20, 10/s), 503 when no target is set or the target Mac is
        not listening.
      security: [{ownerToken: []}, {deviceToken: []}]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gesture]
              additionalProperties: false
              properties:
                gesture:
                  type: string
                  enum: [push, double_push, long_push, turn]
                steps:
                  type: integer
                  minimum: -20
                  maximum: 20
                  description: Detents, signed; `turn` only (not 0), absent for presses.
      responses:
        "200":
          $ref: "#/components/responses/Object"
        "202":
          description: Queued for the target Mac.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [queued]}
                  target: {type: string}
              examples:
                queued:
                  externalValue: ../cmd/ember/testdata/devices/controls_action.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many actions from this caller; honour `Retry-After`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No target Mac is set, or it is not listening. Don't retry the press.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
