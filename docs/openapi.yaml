  /v1/firmware:
    get:
      tags: [firmware]
      operationId: listFirmware
      summary: Stored knob images, newest version first
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: The images (`[]` when none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FirmwareImage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [firmware]
      operationId: uploadFirmware
      summary: Upload a knob image (cinder.bin)
      description: >-
        Checked from the bytes: 64 KiB to 4 MiB, ESP image magic `0xE9`, chip id 9
        (ESP32-S3), `esp_app_desc_t` magic, `project_name` `cinder`, a semantic
        `version`. An image that contains the server's own `EMBER_TOKEN` or the marker
        `CINDER-DEV-SEED-BUILD` is a dev-seed build and refused. The SHA-256 of the
        whole file is pinned. The newest 5 versions are kept, plus any version that is
        a device's target or running firmware. Every version evicted this way, and a
        version replaced with `?replace=1`, is dropped from every knob's OTA `blocked`
        list; a version whose files could not be removed stays blocked and listed.
        A replace writes the new bytes beside the old ones and swaps them in with a
        rename. If the swap fails the answer is an error and the old bytes are moved back; if
        even that fails the version is hidden until the next restart restores the old
        bytes. Once the swap succeeds the answer is 201 even if removing the old copy
        or an evicted version failed (the server logs it).
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [release, test]
            default: test
        - name: replace
          in: query
          required: false
          description: "`1` replaces a stored version with other bytes unless it is a device's target (a target parked after it failed or rolled back does not count). Once stored, the version is unblocked on every knob."
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 4194304
      responses:
        "200":
          description: The same bytes were already stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareImage"
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareImage"
        "400":
          description: '`{"error":"bad_image|wrong_chip|wrong_project|bad_version|dev_seed_build"}`, or a bad `channel`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Body larger than 4 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/firmware/{version}:
    parameters:
      - $ref: "#/components/parameters/FirmwareVersion"
    patch:
      tags: [firmware]
      operationId: patchFirmware
      summary: Move an image to another channel (promote a tested build)
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [release, test]
      responses:
        "200":
          description: The updated image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [firmware]
      operationId: deleteFirmware
      summary: Delete an image and its ELF
      description: >-
        Removes the version's directory and any `.old-<version>-*` copy a replace
        left, also for a version the store does not index (for example a directory
        that failed to load at boot; the answer is then 404). Once they are gone,
        on 204 or 404, the version is dropped from every knob's OTA `blocked` list,
        and every knob outside an active attempt forgets it: a target naming it is
        cleared (bumping the devices epoch), and a record whose last attempt it was
        (unless done) is reset. Retention eviction does the same.
        A target parked after that version failed or rolled back does not block the
        DELETE. A 409 (the version is otherwise targeted, indexed or not, or being
        offered) or a failed removal (500)
        keeps it blocked; after a 500 the version stays listed and whole, so the
        DELETE can be retried.
        With `?keep=protected` (servers listing `firmware_delete_keep` in
        `/version` `features`) it also answers 409 `firmware_kept_in_use` for a
        version any knob runs (by last check-in `fw`) or targets, and
        `firmware_kept_newest` for the newest release image or the newest
        test image when it is newer than the newest release. The check runs
        under the store lock with the device registry held until the build
        is renamed off its live path. Without it, those versions can be deleted.
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      parameters:
        - name: keep
          in: query
          required: false
          schema:
            type: string
            enum: [protected]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The version is a device's target (not one parked after it failed or rolled back) or is being offered, or (with `keep=protected`) `firmware_kept_in_use` / `firmware_kept_newest`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/firmware/{version}/bin:
    parameters:
      - $ref: "#/components/parameters/FirmwareVersion"
    get:
      tags: [firmware]
      operationId: getFirmwareBin
      summary: Download a stored image
      description: '`Content-Disposition: attachment; filename="cinder-<version>.bin"`.'
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: The image bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: The `Range` starts past the end of the file.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/firmware/{version}/elf:
    parameters:
      - $ref: "#/components/parameters/FirmwareVersion"
    get:
      tags: [firmware]
      operationId: getFirmwareELF
      summary: Download an image's ELF
      description: '`Content-Disposition: attachment; filename="cinder-<version>.elf"`. 404 when no ELF is stored.'
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: The ELF bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: The `Range` starts past the end of the file.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [firmware]
      operationId: putFirmwareELF
      summary: Upload the ELF that belongs to a stored image
