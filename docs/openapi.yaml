  /v1/devices/self/checkin:
    post:
      tags: [device-self]
      operationId: deviceCheckin
      summary: A knob reports in and collects config or a rotated token
      security: [{deviceToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fw:
                  type: string
                  maxLength: 32
                fw_build:
                  type: string
                  pattern: "^[0-9a-f]{8}$"
                  description: First 8 hex digits of the running app's ELF SHA-256; ignored when malformed.
                ota:
                  type: object
                  description: The knob's update state (cinder OTA); dropped when invalid.
                  properties:
                    image:
                      type: string
                      enum: [valid, pending_verify, new, undefined]
                    last:
                      type: object
                      required: [result]
                      properties:
                        attempt:
                          type: integer
                          minimum: 0
                          description: >-
                            The offer's `attempt` this result belongs to. A result without the
                            current attempt is ignored. When the knob declines an offer for a
                            lasting reason (its bad-image guard, the per-boot attempt cap) it
                            reports `{"attempt","result":"failed","error":"refused","version"}`.
                        error:
                          type: string
                          pattern: "^[a-z0-9_]{1,24}$"
                        result:
                          type: string
                          enum: [ok, failed, rolled_back]
                        version:
                          type: string
                    phase:
                      type: string
                      enum: [idle, waiting, rebooting]
                    rollback:
                      type: boolean
                      description: The bootloader can roll back (bootloader description version ≥ 2). Without it Ember never offers an image.
                    slot:
                      type: integer
                      enum: [0, 1]
                ip:
                  type: string
                rssi:
                  type: integer
                heap_internal_free:
                  type: integer
                heap_internal_largest:
                  type: integer
                uptime_s:
                  type: integer
                config_version:
                  type: integer
                link_mhz:
                  type: integer
                link_fallback:
                  type: boolean
                wifi:
                  type: object
                  description: Wi-Fi link telemetry (cinder 0.9.8); dropped when invalid.
                  properties:
                    bssid:
                      type: string
                    channel:
                      type: integer
                      minimum: 0
                      maximum: 14
                    disconnects:
                      type: integer
                      minimum: 0
                    last_reason:
                      type: integer
                      minimum: 0
                      maximum: 255
                    rssi_min:
                      type: integer
                      minimum: -127
                      maximum: 0
                diag:
                  type: object
                  description: >-
                    Restart and memory diagnostics (cinder 0.9.13); dropped when invalid.
                    Knob-sent `reboots`, `prev_reset_reason` and `reboots_since_seen` are ignored;
                    the server sets them.
                  properties:
                    boots:
                      type: integer
                      minimum: 0
                    crash:
                      type: object
                      description: Present while a core dump is in flash.
                      properties:
                        id:
                          type: string
                          pattern: "^[0-9a-f]{8}$"
                          description: >-
                            The dump's IDF checksum: the image's last 4 bytes as a little-endian
                            u32 in hex, equal to the CRC-32 (IEEE) of the image without them.
                            Sent with `size`.
                        size:
                          type: integer
                          minimum: 1
                          maximum: 131072
                        pc:
                          type: string
                          pattern: "^0x[0-9a-f]{1,8}$"
                        reason:
                          type: string
                          pattern: "^[a-z0-9_]{1,24}$"
                          description: panic, int_wdt, task_wdt, wdt, lvgl_stall or unknown.
                        task:
                          type: string
                          minLength: 1
                          maxLength: 16
                        elf:
                          type: string
                          pattern: "^[0-9a-f]{8}$"
                          description: The crashed app's ELF SHA-256 prefix, to pair the dump with its ELF.
                    heap_internal_min:
                      type: integer
                      minimum: 0
                    heap_largest_min:
                      type: integer
                      minimum: 0
                    reset_reason:
                      type: string
                      pattern: "^[a-z0-9_]{1,24}$"
                    stack_free:
                      type: object
                      maxProperties: 32
                      propertyNames:
                        minLength: 1
                        maxLength: 16
                      additionalProperties:
                        type: integer
                        minimum: 0
                stats:
                  description: >-
                    Knob diagnostics for the window since the last report, every key optional
                    (ARCHITECTURE "Knob diagnostics"), e.g. `fps`, `inv_areas`, `inv_px`.
                    Unknown keys are ignored; an invalid object is dropped, the checkin still answers 200.
                  type: object
                caps:
                  description: >-
                    What the firmware can do (#341, cinder#27). Absent = legacy knob, mapped
                    from `fw` by the server's table; invalid = dropped, no `caps_ack`.
                    Unknown keys inside are ignored.
                  $ref: "#/components/schemas/DeviceCaps"
            examples:
              checkin_req_minimal:
                externalValue: ../cmd/ember/testdata/devices/checkin_req_minimal.json
              checkin_req_full:
                externalValue: ../cmd/ember/testdata/devices/checkin_req_full.json
              checkin_req_caps:
                externalValue: ../cmd/ember/testdata/devices/checkin_req_caps.json
      responses:
        "200":
          description: The current config version, plus config or new_token when due.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinResult"
              examples:
                checkin_reply_current:
                  externalValue: ../cmd/ember/testdata/devices/checkin_reply_current.json
                checkin_reply_config:
                  externalValue: ../cmd/ember/testdata/devices/checkin_reply_config.json
                checkin_reply_coredump:
                  externalValue: ../cmd/ember/testdata/devices/checkin_reply_coredump.json
                checkin_reply_ota:
                  externalValue: ../cmd/ember/testdata/devices/checkin_reply_ota.json
                checkin_reply_rotation:
                  externalValue: ../cmd/ember/testdata/devices/checkin_reply_rotation.json
                checkin_reply_caps:
                  externalValue: ../cmd/ember/testdata/devices/checkin_reply_caps.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/self/coredump:
    put:
      tags: [device-self]
      operationId: deviceCoredumpUpload
      summary: A knob uploads the core dump a checkin asked for
      description: >-
        Body: the whole image, at most 131072 bytes. Stored when it is at least 8 bytes,
        the CRC-32 (IEEE) of all but its last 4 bytes equals `id`, and those last 4 bytes
        read as a little-endian u32 equal `id`. The newest 3 per device are kept.
      security: [{deviceToken: []}]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{8}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 131072
      responses:
        "204":
          description: Stored, or this id was already stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another upload for this device is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Body larger than 131072 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/devices/self/firmware/{version}:
    parameters:
      - $ref: "#/components/parameters/FirmwareVersion"
    get:
      tags: [device-self]
      operationId: deviceFirmwareDownload
      summary: A knob downloads the image its checkin offered
      description: >-
        Only the version currently offered to this device (409 for any other stored
        version, 404 for an unknown one). `ETag: "<sha256>"`, `Cache-Control: no-store`,
        `Range` and `If-Range` for resume. The write deadline is 10 minutes. The bytes
        sent are the progress the owner sees. Per-device rate limit.
      security: [{deviceToken: []}]
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: bytes=40000-
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The whole image.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: The `Range` starts past the end of the file.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This version is not the one offered to this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many downloads from this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/devices/self/config:
    get:
      tags: [device-self]
      operationId: deviceSelfConfig
      summary: The calling knob's config
      security: [{deviceToken: []}]
      responses:
        "200":
          description: The config and its version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinResult"
              examples:
                config_default:
                  externalValue: ../cmd/ember/testdata/devices/config_default.json
                config_custom:
                  externalValue: ../cmd/ember/testdata/devices/config_custom.json
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/devices/self/view:
    get:
      tags: [device-self]
      operationId: deviceSelfView
      summary: The knob's compact view (v 1)
      description: |
        Everything the knob draws in one poll. ETag/304; `?wait=` (≤25 s)
        long-polls for a change, advertised by `X-Ember-View-Wait`. Carries
        `"quiet": true` while quiet hours are on (absent otherwise); a waiting
        poll wakes at each quiet-hours edge. `weather.observed_at` (Unix
        seconds) is the provider's time for the current values, absent when
        unknown. `weather.model` follows `provider` for an Open-Meteo model
        other than `best_match` (DEVICE-PROTOCOL.md "Weather model"). For a knob that reported `caps`,
        `v` is min(1, `caps.view[1]`) and a page's block (`mood`, `pomo`,
        `weather`, `nowplaying`) is sent only when the page is in `caps.pages`
        and on; a legacy knob's view is unchanged. With the `wx_faces` caps
        feature, `weather` also carries `utc_offset`, `now`, `today`, `rain`
        (`until`, `spells`), `days`, `twilight`, `moon` and `aqi` after
        `observed_at` (DEVICE-PROTOCOL.md "Weather detail"); a body over
        `caps.limits.view_bytes` drops them first. With the `np_cover` caps
        feature, `nowplaying` also carries `accent` (`#RRGGBB`, ≥ 3:1 on
        black) and `cover_version` (`<art_version>-<recipe>`, the `v` for
        `kind=cover`) when there is a picture, then `cover_light: true` when
        the cover's text band is light (absent otherwise, never false)
        (DEVICE-PROTOCOL.md "Prepared cover"). With the `demo` caps feature, `demo` (last key) carries a
        demo scene set from Ember.app: `{id, page, view?, act?, offline?,
        hold}`, where `view` is a whole view that replaces the real one while
        the scene plays (DEVICE-PROTOCOL.md "Demo mode").
      security: [{deviceToken: []}]
      parameters:
        - name: wait
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 25
        - name: demo_id
          in: query
          description: The `demo.id` the knob is reporting on.
          schema:
            type: string
        - name: demo_state
          in: query
          description: >-
            `playing` once the scene shows, on every poll while it does; `done`
            when it ends (the server clears it and serves the next queued scene).
            Required on every request while the knob holds a scene. A request
            without `demo_id` while the server holds the scene as `playing`
            and its last report is 3 s old means the knob lost it (a reboot):
            the demo is dropped.
          schema:
            type: string
            enum: [playing, done]
      responses:
        "200":
          description: The view. Field-by-field shape in ARCHITECTURE.md "Wire protocol" (Knob view); compatibility rules in DEVICE-PROTOCOL.md.
          content:
            application/json:
              schema:
                type: object
              examples:
                view_full:
                  externalValue: ../cmd/ember/testdata/devices/view_full.json
                view_minimal:
                  externalValue: ../cmd/ember/testdata/devices/view_minimal.json
                view_nowplaying_none:
                  externalValue: ../cmd/ember/testdata/devices/view_nowplaying_none.json
                view_single_host_paused:
                  externalValue: ../cmd/ember/testdata/devices/view_single_host_paused.json
                view_quiet:
                  externalValue: ../cmd/ember/testdata/devices/view_quiet.json
                view_caps_limited:
                  externalValue: ../cmd/ember/testdata/devices/view_caps_limited.json
                view_faces:
                  externalValue: ../cmd/ember/testdata/devices/view_faces.json
                view_faces_met:
                  externalValue: ../cmd/ember/testdata/devices/view_faces_met.json
                view_faces_polar_dry:
                  externalValue: ../cmd/ember/testdata/devices/view_faces_polar_dry.json
                view_usage:
                  externalValue: ../cmd/ember/testdata/devices/view_usage.json
                demo_storm:
                  externalValue: ../cmd/ember/testdata/devices/demo/moment.storm.full.json
        "304":
          description: Unchanged since If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/nowplaying/state:
    get:
      tags: [nowplaying]
      operationId: getNowPlayingState
      summary: What is playing
      security: []
      responses:
        "200":
          description: The shown entry, or nulls.
          content:
            application/json:
              schema:
                type: object
              examples:
                golden:
                  externalValue: ../cmd/ember/testdata/dashboard/nowplaying_state.json
                none:
                  externalValue: ../cmd/ember/testdata/dashboard/nowplaying_state_none.json
  /v1/nowplaying/art:
    get:
      tags: [nowplaying]
      operationId: getNowPlayingArt
      summary: Square JPEG of the album, artist, backdrop or prepared cover
      description: |
        `cover` (466 px) is the album picture, else the artist one, cropped
        into an r 208 circle on black with a rim vignette and a bottom scrim
        baked in; its ETag carries the recipe version
        (`"<hash>-cover-466-r1"`). `v` equal to the current `art_version`
        (for `cover`, the `cover_version`, which carries the recipe) makes
        the reply `immutable` for every kind, `artist` included; any other
        `v` gives `no-cache`.
      security: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [album, artist, backdrop, cover]
        - name: size
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: A baseline JPEG with an ETag.
          content:
            image/jpeg:
              schema:
                type: string
                contentEncoding: binary
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [nowplaying]
      operationId: putNowPlayingArt
      summary: Upload art for the current track
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
