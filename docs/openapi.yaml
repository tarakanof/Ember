  /v1/devices/{id}/ota:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [firmware]
      operationId: getKnobOTA
      summary: A knob's firmware update state
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: The update state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [firmware]
      operationId: putKnobOTA
      summary: Set a knob's update mode or target, or retry
      description: >-
        Merge: omitted keys keep their value. Setting a target or a retry bumps
        `X-Ember-Devices-Epoch`, so the knob checks in within one view poll.
        `target: null` cancels an offer that has not started downloading; after a
        failed or rolled-back attempt it also dismisses the failure (phase `idle`,
        `error` null, `blocked` unchanged). A target or retry naming a version
        Ember no longer stores is 400.
        `retry: true` re-offers the last version once with `retry: true` and
        removes it from `blocked`; setting the target to the version that just
        failed or rolled back, or to any blocked version, does the same. A
        successful install also unblocks its version.
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum: [manual, auto]
                target:
                  type: [string, "null"]
                retry:
                  type: boolean
            example:
              target: 0.9.14
      responses:
        "200":
          description: The new update state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `{"error":"no_rollback_bootloader"}`: the last checkin has no `ota.rollback`
            (target or retry only). `{"error":"ota_in_progress"}`: the knob is installing,
            restarting or verifying (or, for clearing the target, downloading), so a new
            target, clearing the target or a retry waits until the attempt ends.
            `{"error":"firmware_changed"}`: stored firmware kept changing while the
            request was checked (any PUT, including a mode change); try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/devices/{id}/demo:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      tags: [devices]
      operationId: startKnobDemo
      summary: Play demo scenes on a knob
      description: >-
        Developer tool (#457). Sets the knob's demo, in memory only: one scene
        (`scene`) or a queue (`scenes`, played in order; `hold` is ignored). The
        newest POST replaces any running demo. The view's `demo` block carries
        it to a knob whose caps list the `demo` feature, and a waiting view
        poll wakes at once. A scene the knob has not reported `playing` 10 s
        after it became available is dropped (`unanswered`, `idle` again 60 s
        later); `done` moves to the next scene under a new id. A held scene
        is dropped 60 s after the knob first reported it `playing`. A knob
        that reboots (a checkin with a higher `diag.boots`, or without boots
        a lower `uptime_s`, for a demo started before that boot; or a view
        request without a report while its scene is `playing` and its last
        report is 3 s old) drops the demo and its queue (`restarted`, `idle`
        again 60 s later).
        DEVICE-PROTOCOL.md "Demo mode".
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scene:
                  type: string
                scenes:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: string
                hold:
                  type: boolean
                  description: Keep the scene up until stopped or 60 s after it starts playing (the knob and the server both cap it). Only with `scene`; ignored with `scenes`, even one.
            example:
              scene: moment.storm.full
              hold: true
      responses:
        "200":
          description: The demo status right after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoStatus"
        "400":
          description: Unknown scene, both or neither of `scene` and `scenes` (`scene` with an empty `scenes` counts as both), or more than 256 scenes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The knob's caps do not list the `demo` feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [devices]
      operationId: getKnobDemo
      summary: A knob's demo status
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "200":
          description: The status; `idle` with empty `scene` and `id` when no demo is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [devices]
      operationId: stopKnobDemo
      summary: Stop a knob's demo
      x-internal: true
      security: [{ownerToken: []}, {clientToken: [admin]}]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
